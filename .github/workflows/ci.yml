name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # git identity + LF handling: the git-transaction and template-integration
      # tests run real `git init`/commit against temp projects and need a
      # committer on bare CI runners; autocrlf=false keeps the LF fixtures stable.
      - name: Configure git
        shell: bash
        run: |
          git config --global user.name "Nihil CI"
          git config --global user.email "ci@nihil.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
